{{ define "main" }}
  {{ $tag := printf "#%s" .Title | lower }}
  {{ .Scratch.Set "description" (T "tagPageDescription" (dict "tag" $tag )) }}
  <h1>{{ $tag }}</h1>
  {{ range .Pages.GroupByDate "2006" "desc" }}
    <h2>{{ .Key }}</h2>
    <ul class="post-list">
      {{ range .Pages }}
        {{ partial "post-item" . }}
      {{ end }}
    </ul>
  {{ end }}
{{ end }}
