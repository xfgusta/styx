<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title  }}{{ end }}</title>

{{ if .IsHome }}
  <meta name="description" content="{{ .Site.Params.description }}">
{{ else if and .IsSection (eq .Section "posts") }}
  <meta name="description" content="{{ T "postsPageDescription" }}">
{{ else if and (eq .Kind "taxonomy") (eq .Section "tags") }}
  <meta name="description" content="{{ T "tagsPageDescription" }}">
{{ else if and (eq .Kind "term") (eq .Section "tags") }}
  <meta name="description" content="{{ T "tagPageDescription" (dict "tag" (printf "#%s" .Title | lower)) }}">
{{ else }}
  <meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
{{ end }}

<link rel="icon" type="image/svg" href="/favicon.svg">

<script>
  (function() {
    try {
      var theme = localStorage.getItem('theme');
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch(e){}
  })();
</script>

{{ partialCached "head/css.html" . }}
{{ partialCached "head/js.html" . }}
